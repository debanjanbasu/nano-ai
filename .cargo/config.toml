[unstable]
build-std = ["std", "panic_abort", "core", "alloc"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m4"]

# Floor for iOS: A14 (Apple7 GPU family, the first with SIMD-group reductions and matrix ops).
[target.aarch64-apple-ios]
rustflags = ["-C", "target-cpu=apple-a14"]

# Latest OS targets (Xcode 27.2 SDKs): rustc's minimum OS version and the metallib's (micro-metal
# build.rs). Xcode's own exports win for app builds; these cover plain `cargo` builds.
[env]
MACOSX_DEPLOYMENT_TARGET = "27.2"
IPHONEOS_DEPLOYMENT_TARGET = "27.2"

